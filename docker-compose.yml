services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodlink
      POSTGRES_PASSWORD: bloodlink
      POSTGRES_DB: bloodlink
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    profiles: ["full"]
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bloodlink:bloodlink@db:5432/bloodlink
    ports:
      - "3000:3000"

volumes:
  pgdata:
